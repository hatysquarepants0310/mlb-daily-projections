[project]
name = "mlb-daily-projections"
version = "1.0.0"
description = "mlbproj: lock at T-10. Daily MLB Log5 × Statcast vs Polymarket. One pick per market."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hatysquarepants0310" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
mlbproj = "mlbproj.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlbproj"]
